version: 2

updates:
  # Every action is pinned to a commit SHA; Dependabot moves the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The theme is a submodule pinned to one commit. A bump must still pass make check,
  # which fails if the theme changed a template this site overrides.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: theme
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 1
