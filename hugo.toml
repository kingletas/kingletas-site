baseURL = "https://www.kingletas.com/"
locale = "en-us"
title = "Luis Tineo"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "Platform and DevOps for Magento and Adobe Commerce: infrastructure, release pipelines, and the tests that prove a deploy worked."
  author = "Luis Tineo"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
  # The default share image (og:image and a large-image card). A post overrides it with `images: ["its-image.png"]` in its front matter.
  images = ["share.png"]

  # TO BE WRITTEN BY THE SITE'S AUTHOR: the sentence that opens the line closing every post. The About and social links follow it.
  closingLine = "Placeholder: a closing sentence goes here."

  [params.homeInfoParams]
    Title = "Hi, I'm Luis"
    Content = """
I build and run the platform under Magento and Adobe Commerce stores: the infrastructure, the release pipeline, and the tooling that proves a deploy worked before a customer finds out it didn't. I've been working in Magento since the 1.x days.

Most of my day is PHP, Python and Ansible. I'm ramping up in Go, Rust and Ruby.
"""

  [[params.socialIcons]]
    name = "github"
    label = "GitHub"
    url = "https://github.com/kingletas"

  [[params.socialIcons]]
    name = "linkedin"
    label = "LinkedIn"
    url = "https://www.linkedin.com/in/luistineo/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "sre"
    name = "SRE"
    url = "/sre/"
    weight = 15

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40

[markup.goldmark.renderer]
  unsafe = false
